<style>
/* Existing CSS remains exactly same */
:root{
  --bg:#0b0d17; --surface:#141826; --surface-2:#1c2135; --border:#262c44;
  --text:#f2f4fb; --muted:#8e94b3; --primary:#7c5cff; --primary-2:#5b8dff;
  --accent:#ff5c9d; --success:#22c58a; --warning:#ffb547; --danger:#ff5773;
  --grad-hero:linear-gradient(135deg,#7c5cff 0%,#5b8dff 50%,#22c9d9 100%);
  --shadow-glow:0 10px 40px -10px rgba(124,92,255,.55);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:100px;overflow-x:hidden}
#app-loader{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
.spinner{width:40px;height:40px;border:3px solid var(--surface-2);border-top:3px solid var(--primary);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.app-header{position:sticky;top:0;z-index:100;backdrop-filter:blur(18px);background:rgba(11,13,23,.85);border-bottom:1px solid var(--border)}
.app-header .row{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800}
.brand-logo{width:34px;height:34px;border-radius:10px;background:var(--grad-hero);display:grid;place-items:center;box-shadow:var(--shadow-glow)}
.user-chip{display:flex;align-items:center;gap:8px;padding:4px 8px;border:1px solid var(--border);border-radius:999px;background:var(--surface)}
.user-avatar{width:24px;height:24px;border-radius:50%;background:var(--grad-hero);display:grid;place-items:center;font-size:11px;font-weight:700}
.admin-badge{font-size:8px;padding:2px 5px;border-radius:4px;background:linear-gradient(135deg,#ff5c9d,#ffb547);color:#1a1035;font-weight:800;margin-left:4px}
.search-container{padding:10px 16px}.search-box{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);padding:10px 15px;border-radius:14px}
.search-box input{background:none;border:none;color:#fff;font-size:14px;width:100%;outline:none}
.cat-tabs{display:flex;gap:8px;overflow-x:auto;padding:0 16px 15px;scrollbar-width:none}
.tab{padding:8px 16px;background:var(--surface);border:1px solid var(--border);border-radius:12px;font-size:13px;white-space:nowrap;transition:0.3s}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff}
.hero-card{background:var(--grad-hero);padding:20px;border-radius:24px;margin:0 16px 20px;box-shadow:var(--shadow-glow)}
.view{display:none;padding:0 16px}.view.active{display:block;animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;position:relative}
.card-thumb{aspect-ratio:16/10;position:relative;background:#000}
.card-thumb img{width:100%;height:100%;object-fit:cover}
.card-badge{position:absolute;top:8px;left:8px;padding:3px 7px;border-radius:6px;font-size:9px;font-weight:700;backdrop-filter:blur(6px)}
.badge-locked{background:rgba(0,0,0,0.6);color:var(--warning)}
.badge-unlocked{background:rgba(34,197,138,0.85);color:#fff}
.card-body{padding:10px}.card-title{font-size:13px;font-weight:600;line-height:1.3;height:34px;overflow:hidden}
.modal{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);display:none;align-items:flex-end}
.modal.open{display:flex}.modal-sheet{background:var(--bg);width:100%;max-height:92vh;border-radius:28px 28px 0 0;overflow:hidden;display:flex;flex-direction:column}
.sheet-header{padding:16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.sheet-content{padding:16px;overflow-y:auto;flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:12px 20px;border-radius:14px;font-weight:700;font-size:14px;width:100%;border:none;color:#fff;cursor:pointer}
.btn-p{background:var(--grad-hero)}.btn-g{background:var(--surface-2)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(11,13,23,0.9);backdrop-filter:blur(15px);border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:10px 5px;z-index:150}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:10px;background:none;border:none}
.nav-item.active{color:var(--primary)}
.admin-card{background:var(--surface);border:1px solid var(--border);padding:15px;border-radius:18px;margin-bottom:15px}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:11px;margin-bottom:5px;color:var(--muted)}
.form-group input, .form-group select, .form-group textarea{width:100%;background:var(--bg);border:1px solid var(--border);padding:10px;border-radius:10px;color:#fff}
.hidden{display:none}
#toast-container{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:2000;width:90%}
.toast{background:var(--surface-2);padding:12px 16px;border-radius:12px;margin-bottom:10px;font-size:13px;display:flex;align-items:center;gap:10px;border:1px solid var(--border)}
</style>
</head>
<body>

</div>

<header class="app-header">
  <div class="row">

        <div style="font-size:14px">VidUnlock</div>

      <div class="user-avatar" id="u-avatar">U</div>

<!-- VIEW: HOME -->

  <div class="hero-card">

  </div>
  <h3 class="page-title" style="margin:15px 0" data-i18n="all_videos">সব ভিডিও</h3>
  <div class="grid" id="main-grid"></div>
</section>

<!-- VIEW: FAVORITES -->
<section class="view" id="view-fav">

</section>

<!-- VIEW: UNLOCKED -->
<section class="view" id="view-unlock">
  <h3 class="page-title" style="margin:15px 0" data-i18n="unlocked_videos">আনলক করা</h3>
  <div class="grid" id="unlock-grid"></div>
</section>

<!-- VIEW: PROFILE -->
<section class="view" id="view-profile">
  <div style="text-align:center;padding:30px 0">
    <div id="prof-pic" style="width:80px;height:80px;border-radius:50%;background:var(--grad-hero);margin:0 auto 15px;display:grid;place-items:center;font-size:30px;border:3px solid var(--surface-2)">U</div>
    <h2 id="prof-name">Guest</h2>
    <p style="color:var(--muted);font-size:12px" id="prof-id">ID: 000000</p>
  </div>

  <div class="admin-card">
    <div class="form-group">
      <label data-i18n="select_language">ভাষা নির্বাচন করুন</label>
      <select id="lang-selector" onchange="changeLanguage(this.value)">
        <option value="bn">বাংলা</option>
        <option value="en">English</option>
      </select>
    </div>
  </div>

  <div class="admin-card" style="padding:0">
    <button class="btn btn-g" style="justify-content:flex-start" onclick="showView('fav')" data-i18n="my_favorites">❤️ আমার পছন্দের ভিডিও</button>
    <div style="height:1px;background:var(--border)"></div>
    <button class="btn btn-g" style="justify-content:flex-start" onclick="showView('unlock')" data-i18n="unlocked_videos">🔓 আনলক করা ভিডিও</button>
  </div>
</section>

<!-- VIEW: ADMIN -->
<section class="view" id="view-admin">
  <h3 class="page-title">🛠 অ্যাডমিন প্যানেল</h3>
  <div class="admin-card">
    <h4>➕ নতুন ভিডিও যোগ করুন</h4>
    <div class="form-group"><label>শিরোনাম</label><input type="text" id="av-title"></div>
    <div class="form-group"><label>ক্যাটাগরি</label><select id="av-cat"></select></div>
    <div class="form-group"><label>থাম্বনেইল URL</label><input type="text" id="av-thumb"></div>

    <div class="form-group"><label>প্রয়োজনীয় বিজ্ঞাপন (Required Ads)</label><input type="number" id="av-ads" value="1"></div>
    <button class="btn btn-p" onclick="adminSaveVideo()" id="btn-save-video">সেভ ভিডিও (Global)</button>
  </div>
  <div id="admin-vid-list"></div>
</section>

<!-- MODAL: DETAIL -->
<div class="modal" id="modal-detail">
  <div class="modal-sheet">
    <div class="sheet-header">
      <button onclick="closeModal('modal-detail')" style="background:none;border:none;font-size:22px;color:#fff">✕</button>
      <div id="md-header-title" style="font-weight:700">Video Details</div>
      <button id="md-fav-btn" style="background:none;border:none;font-size:22px">🤍</button>
    </div>
    <div class="sheet-content">
      <div id="md-media-container" style="width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;background:#000;margin-bottom:15px"></div>
      <h2 id="md-title"></h2>
      <div style="margin:10px 0"><span class="badge-unlocked" id="md-badge" style="padding:2px 8px;border-radius:6px;font-size:10px">Premium</span></div>
      <div id="md-action-area"></div>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-item active" onclick="showView('home')"><i>🏠</i><span data-i18n="nav_home">হোম</span></button>
  <button class="nav-item" onclick="showView('fav')"><i>❤️</i><span data-i18n="nav_fav">পছন্দ</span></button>
  <button class="nav-item" onclick="showView('unlock')"><i>🔓</i><span data-i18n="nav_unlock">আনলক</span></button>
  <button class="nav-item" onclick="showView('profile')"><i>👤</i><span data-i18n="nav_profile">প্রোফাইল</span></button>
  <button class="nav-item hidden" id="nav-admin" onclick="showView('admin')"><i>🛠</i>অ্যাডমিন</button>
</nav>

<div id="toast-container"></div>

<script>
/* =======================================================
   1. CONFIGURATION & STATE
   ======================================================= */
const SUPABASE_URL = "YOUR_SUPABASE_URL"; 
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
const ADMIN_ID = 7904568371; // আপনার টেলিগ্রাম আইডি

const supabase = idb = supabaseJs.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const tg = window.Telegram.WebApp;
const user = tg.initDataUnsafe?.user || { id: 123456, first_name: 'Guest', username: 'guest' };

let state = {
  videos: [],
  categories: [],
  userUnlocks: {}, // {vid_id: {ads_watched, is_unlocked}}
  userFavs: new Set(),
  language: 'bn'
};

const i18n = {
  bn: {
    loading: "লোড হচ্ছে...", premium_access: "প্রিমিয়াম এক্সেস", search_placeholder: "ভিডিও খুঁজুন...",
    all_videos: "সব ভিডিও", my_favorites: "আপনার পছন্দ", unlocked_videos: "আনলক করা",
    hero_desc: "আপনার পছন্দের প্রিমিয়াম ভিডিওগুলো আনলক করুন একদম ফ্রিতে।",
    select_language: "ভাষা নির্বাচন করুন", nav_home: "হোম", nav_fav: "পছন্দ",
    nav_unlock: "আনলক", nav_profile: "প্রোফাইল", watch_ad: "ভিডিও দেখতে বিজ্ঞাপন দেখুন",
    congrats: "অভিনন্দন! ভিডিওটি আনলক হয়েছে।", ad_success: "বিজ্ঞাপন সফলভাবে দেখা হয়েছে!"
  },
  en: {
    loading: "Loading...", premium_access: "PREMIUM ACCESS", search_placeholder: "Search videos...",
    all_videos: "All Videos", my_favorites: "My Favorites", unlocked_videos: "Unlocked",
    hero_desc: "Unlock your favorite premium videos for free.",
    select_language: "Select Language", nav_home: "Home", nav_fav: "Favorites",
    nav_unlock: "Unlocked", nav_profile: "Profile", watch_ad: "Watch Ad to Unlock",
    congrats: "Congrats! Video unlocked successfully.", ad_success: "Ad watched successfully!"
  }
};

/* =======================================================
   2. INITIALIZATION
   ======================================================= */
async function init() {
  tg.ready();
  tg.expand();
  
  // Sync User to Supabase
  await syncUser();
  
  // Load Global Data
  await loadGlobalData();
  
  // UI Setup
  updateLanguageUI();
  updateUserUI();
  renderAll();
  
  document.getElementById('app-loader').style.display = 'none';
}

async function syncUser() {
  const { data, error } = await supabase.from('users').upsert({
    telegram_id: user.id,
    first_name: user.first_name,
    last_name: user.last_name || '',
    username: user.username || '',
    photo_url: user.photo_url || ''
  }).select();
  
  if (data && data[0]) state.language = data[0].language || 'bn';
  document.getElementById('lang-selector').value = state.language;

  // Load User Specific Data
  const { data: unlocks } = await supabase.from('user_progress').select('*').eq('user_id', user.id);
  unlocks?.forEach(u => state.userUnlocks[u.video_id] = u);

  const { data: favs } = await supabase.from('favorites').select('video_id').eq('user_id', user.id);
  favs?.forEach(f => state.userFavs.add(f.video_id));
}

async function loadGlobalData() {
  const { data: vids } = await supabase.from('videos').select('*').eq('is_active', true);
  const { data: cats } = await supabase.from('categories').select('*').order('display_order');
  state.videos = vids || [];
  state.categories = cats || [];
}

/* =======================================================
   3. RENDERING
   ======================================================= */
function renderAll() {
  renderGrid('main-grid', state.videos);
  renderGrid('fav-grid', state.videos.filter(v => state.userFavs.has(v.id)));
  renderGrid('unlock-grid', state.videos.filter(v => state.userUnlocks[v.id]?.is_unlocked));
  renderCategories();
}

function renderGrid(containerId, vids) {
  const grid = document.getElementById(containerId);
  if (!vids.length) {
    grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted)">No videos found</div>`;
    return;
  }
  grid.innerHTML = vids.map(v => {
    const isUnlocked = state.userUnlocks[v.id]?.is_unlocked;
    return `
      <div class="card" onclick="openDetail('${v.id}')">
        <div class="card-thumb">
          <img src="${v.thumbnail_url}" loading="lazy">
          <div class="card-badge ${isUnlocked ? 'badge-unlocked' : 'badge-locked'}">
            ${isUnlocked ? '🔓 UNLOCKED' : '🔒 LOCKED'}
          </div>
        </div>
        <div class="card-body">
          <div class="card-title">${v.title}</div>
        </div>
      </div>
    `;
  }).join('');
}

function renderCategories() {
  const tabs = document.getElementById('category-tabs');
  tabs.innerHTML = state.categories.map(c => `
    <button class="tab" onclick="filterCat('${c.id}')">${c.icon} ${c.name}</button>
  `).join('');
  
  const select = document.getElementById('av-cat');
  if(select) select.innerHTML = state.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

/* =======================================================
   4. VIDEO ACTIONS & ADS
   ======================================================= */
let currentVid = null;

async function openDetail(id) {
  currentVid = state.videos.find(v => v.id === id);
  const isUnlocked = state.userUnlocks[id]?.is_unlocked;
  
  document.getElementById('md-title').textContent = currentVid.title;
  document.getElementById('md-fav-btn').textContent = state.userFavs.has(id) ? '❤️' : '🤍';
  document.getElementById('md-fav-btn').onclick = () => toggleFav(id);

  const media = document.getElementById('md-media-container');
  const action = document.getElementById('md-action-area');

  if (isUnlocked) {
    media.innerHTML = `<video src="${currentVid.video_url}" controls controlsList="nodownload" style="width:100%;height:100%"></video>`;
    action.innerHTML = `<button class="btn btn-p" onclick="window.open('${currentVid.video_url}')">OPEN EXTERNAL PLAYER</button>`;
  } else {
    media.innerHTML = `<img src="${currentVid.thumbnail_url}" style="width:100%;height:100%;object-fit:cover">`;
    const progress = state.userUnlocks[id]?.ads_watched || 0;
    const req = currentVid.required_ads;
    action.innerHTML = `
      <div style="margin-bottom:10px;font-size:12px;text-align:center">Progress: ${progress}/${req} Ads</div>
      <button class="btn btn-p" onclick="watchAd()" id="ad-btn">${i18n[state.language].watch_ad}</button>
    `;
  }
  document.getElementById('modal-detail').classList.add('open');
}

async function watchAd() {
  const btn = document.getElementById('ad-btn');
  btn.disabled = true;
  btn.textContent = "Loading Ad...";

  try {
    await show_11404425(); // Ad SDK Call
    await handleAdSuccess();
  } catch (e) {
    showToast("Ad failed to load", "danger");
    btn.disabled = false;
  }
}

async function handleAdSuccess() {
  const vidId = currentVid.id;
  let currentProg = state.userUnlocks[vidId] || { ads_watched: 0, is_unlocked: false };
  
  currentProg.ads_watched++;
  if (currentProg.ads_watched >= currentVid.required_ads) {
    currentProg.is_unlocked = true;
    showToast(i18n[state.language].congrats, "success");
  } else {
    showToast(i18n[state.language].ad_success, "info");
  }

  // Save to Supabase
  await supabase.from('user_progress').upsert({
    user_id: user.id,
    video_id: vidId,
    ads_watched: currentProg.ads_watched,
    is_unlocked: currentProg.is_unlocked
  });

  state.userUnlocks[vidId] = currentProg;
  openDetail(vidId); // Refresh modal
  renderAll(); // Refresh background
}

/* =======================================================
   5. ADMIN FUNCTIONS
   ======================================================= */
async function adminSaveVideo() {
  if (user.id !== ADMIN_ID) return;
  const title = document.getElementById('av-title').value;
  const category_id = document.getElementById('av-cat').value;
  const thumbnail_url = document.getElementById('av-thumb').value;
  const video_url = document.getElementById('av-link').value;
  const required_ads = document.getElementById('av-ads').value;

  const { error } = await supabase.from('videos').insert([{
    title, category_id, thumbnail_url, video_url, required_ads
  }]);

  if (!error) {
    showToast("Global Video Added!");
    loadGlobalData().then(renderAll);
  } else {
    showToast("Error adding video", "danger");
  }
}

/* =======================================================
   6. UTILS
   ======================================================= */
async function changeLanguage(lang) {
  state.language = lang;
  await supabase.from('users').update({ language: lang }).eq('telegram_id', user.id);
  updateLanguageUI();
}

function updateLanguageUI() {
  const texts = i18n[state.language];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = texts[el.getAttribute('data-i18n')];
  });
  document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    el.placeholder = texts[el.getAttribute('data-i18n-placeholder')];
  });
}

function showView(viewId) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById('view-' + viewId).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  if (user.id === ADMIN_ID) document.getElementById('nav-admin').classList.remove('hidden');
}

function toggleFav(vidId) {
  if (state.userFavs.has(vidId)) {
    state.userFavs.delete(vidId);
    supabase.from('favorites').delete().eq('user_id', user.id).eq('video_id', vidId).then();
  } else {
    state.userFavs.add(vidId);
    supabase.from('favorites').insert({ user_id: user.id, video_id: vidId }).then();
  }
  document.getElementById('md-fav-btn').textContent = state.userFavs.has(vidId) ? '❤️' : '🤍';
  renderAll();
}

function showToast(msg, type = 'info') {
  const container = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<span>${type === 'success' ? '✅' : 'ℹ️'}</span> ${msg}`;
  container.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

function updateUserUI() {
  document.getElementById('u-name').textContent = user.first_name;
  document.getElementById('u-avatar').textContent = user.first_name[0];
  document.getElementById('prof-name').textContent = user.first_name;
  document.getElementById('prof-id').textContent = `ID: ${user.id}`;
  if (user.id === ADMIN_ID) document.getElementById('u-badge').style.display = 'block';
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
  document.getElementById('md-media-container').innerHTML = '';
}

window.onload = init;
</script>
</body>
</html>
